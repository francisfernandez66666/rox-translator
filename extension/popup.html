<!DOCTYPE html>
<!-- popup.html — 插件设置页：服务地址 / API Key / 默认目标语言 -->
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <style>
    /* ★ 2026-09-22 全站 UI 还原批：本弹窗原先是「indigo #1a237e 主色 + 白底 + 绿色成功态」的旧主题。
       插件页既不在前端构建产物、也不在后端直出 HTML 里，两套闸门都扫不到它，属还原盲区。
       现按《UI-ANNOTATIONS》§1.1 令牌出纯黑单色（全站无蓝无绿）：面 #000/#0A0B0D/#0E1014、
       文字 #E7E9EA/#9AA0AA/#71767B、主按钮纯白底黑字（交付真值）。
       ★ 2026-09-23 〇-P 用户后令「严格按 UI 交付稿来」：撤销 〇-O，描边档 --lc-line 回交付
       灰阶 #464C58（〇-O 的纯白作废），描边宽度回交付档 1.2px；聚焦态改用外扩白色光环表达
       （灰阶框之上没有更亮的边框档，故用 ring 而不是提边框）。 */
    :root{
      --lc-bg:#000000;--lc-panel:#0E1014;--lc-inset:#0A0B0D;
      --lc-text:#E7E9EA;--lc-text-2:#9AA0AA;--lc-text-3:#71767B;
      --lc-line:#464C58;--lc-white:#FFFFFF;
    }
    body { width: 300px; margin: 0; padding: 16px; font: 15px/1.6 system-ui, sans-serif; background: var(--lc-bg); color: var(--lc-text); }
    h1 { font-size: 17px; font-weight: 700; margin: 0 0 10px; color: var(--lc-white); }
    label { display: block; margin: 10px 0 4px; color: var(--lc-text-2); }
    /* 输入类统一取「凹陷底 #0A0B0D + 1.2px 灰阶描边」（交付档），select 原先的内联样式并入此条，避免两处各写一套 */
    input, select { width: 100%; box-sizing: border-box; padding: 8px 10px; background: var(--lc-inset); border: 1.2px solid var(--lc-line); border-radius: 8px; font-size: 15px; font-family: inherit; color: var(--lc-text); }
    input:focus, select:focus { outline: none; border-color: var(--lc-white); box-shadow: 0 0 0 2px rgba(255, 255, 255, .28); }
    /* 主按钮＝纯白底黑字（交付真值 .lc-btn--primary{background:#FFFFFF}），hover 用降透明而不是变蓝 */
    button { margin-top: 14px; width: 100%; padding: 9px; border: none; border-radius: 8px; background: var(--lc-white); color: #000000; font-weight: 500; cursor: pointer; }
    button:hover { opacity: .88; }
    .hint { color: var(--lc-text-3); font-size: 14px; margin-top: 10px; }
    /* 成功态不再标绿（§1.1 全站无绿）：走主文字档 + 面板底，靠文案与勾号表意 */
    .ok { color: var(--lc-text); background: var(--lc-panel); border: 1.2px solid var(--lc-line); border-radius: 8px; padding: 6px 8px; display: none; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>能言 · 划词翻译</h1>
  <label>服务地址</label>
  <input id="baseUrl" placeholder="https://translator.example.com" />
  <label>API Key（管理后台签发）</label>
  <input id="apiKey" placeholder="tk_..." />
  <label>目标语言（逗号分隔，如 en,ja）</label>
  <input id="langs" placeholder="en" />
  <label>翻译模式</label>
  <select id="mode">
    <option value="fast">快速（默认，秒级，无知识库）</option>
    <option value="pro">专业（校对+知识库，质量更高）</option>
  </select>
  <button id="save">保存</button>
  <div class="ok" id="ok">已保存 ✓ 选中网页文字即可翻译</div>
  <div class="hint">选中文字 → 点「译」按钮 → 气泡显示结果。句数按企业套餐计费。</div>
  <script src="popup.js"></script>
</body>
</html>
