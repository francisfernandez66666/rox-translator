# ============================================================================
# 最小 CI（2026-09-15 闸门补防 P1-4）：每次 push / PR 跑「快闸门」——
#   后端 go vet + go test -race（SQLite 方言即可，pgvector 依赖用例自动跳过）；
#   前端 typecheck + vitest 单测。
# PG 全矩阵（scripts/uat/run_uat.sh：API+T 专项+Playwright）依赖本机 PG/pgvector，
#   发布前在部署机手跑（上生产操作手册既有要求）；如后续接入带 pgvector 的
#   self-hosted runner，再把 run_uat.sh 提进本 workflow。
# ★ P2（2026-09-16）：新增 e2e 闸门 job——SQLite 方言跑全量 run_uat.sh
#   （构建+mock LLM/chain+API 主链路+交易专项+Playwright，race 由 backend job 覆盖
#   故 UAT_SKIP_RACE=1 跳过），把「Playwright 不在 CI 闸门」的缺口补上。
#   PG 方言矩阵仍在发布机手跑（schema/方言差异未 100% 等价）。
# ★ 改造 1A（2026-09-17）：AI 助手（assist）并入主 module 后，
#   - 其 27 个单测函数已随 backend job 的 ./internal/... 自动纳入 CI（此前零覆盖）；
#   - 新增 assist job 跑 scripts/uat/assist_uat.sh（自起 mock 服务，无外部依赖）。
# ============================================================================
name: ci

# ★ #55（2026-09-22，报告 §3.1 / §6 P0-1）：触发分支必须覆盖**长期开发分支**。
#   此前 push 只列 main/master，autosales 上的 184 个未提交改动与 45 个未跟踪文件
#   从未进过任何闸门 ⇒ gofmt 不合格、红灯 spec 长期潜伏无人察觉（§3 三条红灯即实例）。
#   取舍说明：不改成 branches: ['**'] 是因为 e2e / uat-pg 两个 job 各带 Playwright +
#   全量 UAT（单次数十分钟），任意临时分支推送即触发会把 runner 时间烧在探索性提交上；
#   改为「显式列出常驻开发分支」。以后新开长期分支时把分支名加进本列表即可（PR 触发不受影响）。
on:
  push:
    branches: [main, master, autosales]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend-go/go.sum
      # ★ #55（2026-09-22）：gofmt 进闸门。此前全仓检索证实 gofmt 从未被任何闸门约束
      #   （ci.yml / AGENTS.md / scripts 零命中），HEAD 上就有 7 个文件格式不合格。
      #   两道保险：① shell 直查 internal/cmd（快、报错即文件名清单）；
      #   ② internal/gofmt_gate_test.go（随 go test 覆盖 cmd/ 之外全仓 + 豁免清单腐化检查）。
      - name: gofmt gate（零格式债）
        run: |
          bad=$(gofmt -l internal cmd)
          if [ -n "$bad" ]; then
            echo "::error::以下文件未 gofmt（执行 cd backend-go && gofmt -w <file>）："
            echo "$bad"
            exit 1
          fi
        working-directory: backend-go
      - name: go vet
        run: go vet ./...
        working-directory: backend-go
      # ★ P0-6（2026-09-18）：管线 Python 自检进闸门。旧 CI 不装 pymupdf/python-docx，
      #   fileproc 的 selftest 用例在 go test 下恒「退出码 2=依赖缺失→skip」，
      #   产物级回归（缩进损坏/表格几何/零命中口径）CI 完全看不见。
      #   此处显式安装依赖并直跑两脚本 selftest：任何非 0（含 2）一律红灯。
      - name: pipeline python selftests（pdf_overlay / docx_translate）
        run: |
          python3 -m pip install --quiet pymupdf python-docx
          run_selftest() {
            local script=$1 name=$2
            python3 "$script" selftest
            local rc=$?
            if [ $rc -eq 2 ]; then
              echo "::error::$name 自检因依赖缺失被跳过（CI 必须实跑，skip 即红灯）"
              return 1
            fi
            return $rc
          }
          run_selftest internal/fileproc/pdf_overlay.py pdf_overlay || exit 1
          run_selftest internal/fileproc/docx_translate.py docx_translate || exit 1
        working-directory: backend-go
      - name: go test -race
        run: go test -race -count=1 ./internal/... ./cmd/...
        working-directory: backend-go

  # ★ 改造 1A（2026-09-17）：AI 助手（assist）UAT 进闸门。
  #   此前 assist_uat.sh 与 ai-assist 的 27 个单测都只能手工跑（ci.yml 零处提及 assist）；
  #   融合后单测已由 backend job 覆盖，本 job 补上端到端 UAT（自起 mock 服务，无外部依赖）。
  assist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend-go/go.sum
      - name: assist UAT（内嵌 seed/管理页 + 管理台 Token 桥接 + 管理端 CRUD）
        run: bash scripts/uat/assist_uat.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: install
        run: npm ci
        working-directory: frontend-react
      - name: typecheck
        run: npm run typecheck
        working-directory: frontend-react
      - name: unit tests
        run: npx vitest run
        working-directory: frontend-react

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: install
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: frontend-react
      - name: UAT gate（SQLite 方言：API 主链路 + 交易专项 + Playwright）
        run: UAT_SKIP_RACE=1 DB_DRIVER=sqlite bash scripts/uat/run_uat.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend-react/artifacts
            frontend-react/test-results
          if-no-files-found: ignore

  # ★ 2026-09-16 测试盲区补全（核实与修复_测试盲区补全_20260916.md 三.1）：
  #   PG 生产方言矩阵进 CI——此前 run_uat.sh 的 PG 主矩阵靠发布机手跑（自律闸门）。
  #   pgvector 服务容器 + run_uat.sh 全量（API 主链路 + 交易专项 T 套件 + Playwright）；
  #   race 由 backend job 覆盖故跳过；SDK 行为级测试一并纳入。
  uat-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: install
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: frontend-react
      - name: SDK behavior tests（TS node:test + Python unittest）
        run: |
          ( cd sdk/typescript && npm install --no-audit --no-fund && npm test )
          ( cd sdk/python && python3 -m unittest test_translator_sdk )
      - name: UAT gate（PG 方言 + pgvector：API 主链路 + 交易专项 + Playwright）
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          UAT_SKIP_RACE=1 DB_DRIVER=postgres \
            PG_ADMIN_DSN="postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable" \
            DB_DSN="postgres://postgres:postgres@127.0.0.1:5432/translator_uat?sslmode=disable" \
            bash scripts/uat/run_uat.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uat-pg-artifacts
          path: |
            frontend-react/artifacts
            frontend-react/test-results
          if-no-files-found: ignore
