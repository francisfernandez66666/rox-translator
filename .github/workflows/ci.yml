# ============================================================================
# 最小 CI（2026-09-15 闸门补防 P1-4）：每次 push / PR 跑「快闸门」——
#   后端 go vet + go test -race（SQLite 方言即可，pgvector 依赖用例自动跳过）；
#   前端 typecheck + vitest 单测。
# PG 全矩阵（scripts/uat/run_uat.sh：API+T 专项+Playwright）依赖本机 PG/pgvector，
#   发布前在部署机手跑（上生产操作手册既有要求）；如后续接入带 pgvector 的
#   self-hosted runner，再把 run_uat.sh 提进本 workflow。
# ★ P2（2026-09-16）：新增 e2e 闸门 job——SQLite 方言跑全量 run_uat.sh
#   （构建+mock LLM/chain+API 主链路+交易专项+Playwright，race 由 backend job 覆盖
#   故 UAT_SKIP_RACE=1 跳过），把「Playwright 不在 CI 闸门」的缺口补上。
#   PG 方言矩阵仍在发布机手跑（schema/方言差异未 100% 等价）。
# ============================================================================
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend-go/go.sum
      - name: go vet
        run: go vet ./...
        working-directory: backend-go
      - name: go test -race
        run: go test -race -count=1 ./internal/... ./cmd/...
        working-directory: backend-go

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: install
        run: npm ci
        working-directory: frontend-react
      - name: typecheck
        run: npm run typecheck
        working-directory: frontend-react
      - name: unit tests
        run: npx vitest run
        working-directory: frontend-react

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: install
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: frontend-react
      - name: UAT gate（SQLite 方言：API 主链路 + 交易专项 + Playwright）
        run: UAT_SKIP_RACE=1 DB_DRIVER=sqlite bash scripts/uat/run_uat.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend-react/artifacts
            frontend-react/test-results
          if-no-files-found: ignore

  # ★ 2026-09-16 测试盲区补全（核实与修复_测试盲区补全_20260916.md 三.1）：
  #   PG 生产方言矩阵进 CI——此前 run_uat.sh 的 PG 主矩阵靠发布机手跑（自律闸门）。
  #   pgvector 服务容器 + run_uat.sh 全量（API 主链路 + 交易专项 T 套件 + Playwright）；
  #   race 由 backend job 覆盖故跳过；SDK 行为级测试一并纳入。
  uat-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: install
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: frontend-react
      - name: SDK behavior tests（TS node:test + Python unittest）
        run: |
          ( cd sdk/typescript && npm install --no-audit --no-fund && npm test )
          ( cd sdk/python && python3 -m unittest test_translator_sdk )
      - name: UAT gate（PG 方言 + pgvector：API 主链路 + 交易专项 + Playwright）
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          UAT_SKIP_RACE=1 DB_DRIVER=postgres \
            PG_ADMIN_DSN="postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable" \
            DB_DSN="postgres://postgres:postgres@127.0.0.1:5432/translator_uat?sslmode=disable" \
            bash scripts/uat/run_uat.sh
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uat-pg-artifacts
          path: |
            frontend-react/artifacts
            frontend-react/test-results
          if-no-files-found: ignore
