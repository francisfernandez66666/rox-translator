    <!-- ★★ 2026-10-17 首屏静态骨架（轻量化批 C）——慢链路上的「秒开」那一半。
         背景：跨境实测入口 br 163 KB 在 6~20 KB/s 的链路上要 10~33 s 才到，此前这段
         时间屏幕只有一个 `#root` 空容器＝**纯黑**（哨兵那份「还在加载」横幅要 8 s 之后才出）。
         本骨架是**纯 HTML+CSS**（无 JS、无外链、无文案）：入口包一到、React 一挂载就撤。
         四条硬口径（判据见 src/bootStorageGate.test.ts 启动链锁 D）：
           ① **必须是 #root 的兄弟节点**，不许放进 #root——哨兵的「界面起来了吗」判据正是
              `#root.childElementCount`，塞进去会让哨兵以为界面已挂载而提前收摊；
           ② **不含任何文案**（多字节字符一律不许有）：文案要跟 12 语种、租户品牌走，
              写死就会在换语种/换租户时闪一句错的；骨架只给一枚转圈，语义由哨兵横幅承担；
           ③ **不含任何资源引用**（不放 logo、不放 svg 文件）：logo 在本仓有唯一事实源，
              第三份拷贝就是漂移温床（logoConsistency.test.ts 那条口径）；
           ④ **必须在两条路径上撤**：界面挂载即撤（与哨兵收摊同一分支）、确定失效转全屏面板时也撤
              （不能留一个转圈在错误面板背后空转）；慢链路横幅那一档**保留**骨架（那一档本就是"还在加载"）。
         ⚠️ 描边用 1.2px（〇-P 交付档）而不是 2px：环形是**图形笔画**，但源码级闸门按字面扫
            `border` 宽度，写 2px 会被判成「擅自抬档」——照交付档写就没有这一层争议。
         ⑤ ★ 2026-10-17 批 B：容器与转圈两份声明**同时服务 React 侧占位**（`components/BootLoading.tsx`，
            它在 `#root` 里渲染 `.lc-boot-cover` + `.lc-boot-spin`）——懒加载分片没到时也让 `#root` 非空，
            否则哨兵会在截止时刻把"正在正常下载"误判成「页面没能加载起来」而盖全屏错误面板。
            所以选择器写成 `#__boot_skeleton, .lc-boot-cover`（**一份声明两个消费者**，
            值只许在这里改；React 侧不许内联第二份几何）。 -->
    <style>
      #__boot_skeleton,
      .lc-boot-cover {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;

      .lc-boot-spin {

        .lc-boot-spin {

    </style>
    <!-- ★★ 2026-10-12 启动哨兵（现网「标签标题正常、页面整片黑」的机械防线）
         背景：首页只有 <div id="root"> 一个空容器，界面全靠入口 JS 挂载。只要那条腿没跑完
         （脚本没下载到／模块评估中途抛异常／浏览器拒绝站点数据），用户拿到的就是**纯黑屏零提示**，
         连「打开控制台看红字」都没法要求普通访客做到。哨兵放在 <head>、且是**普通内联脚本**
         （不是 type=module），因此它比入口包先执行、也不受入口包失败的影响。
          三条口径：① 只在 #root 一直空着时才显示，界面正常起来就自己收摊（零打扰）；
          ② 只做**读数**不做猜测——把「站点数据是否被拒」「哪个脚本没加载」「哪一行抛了异常」
          「哪个界面模块的加载被拒绝了」（★ 2026-10-17 补：路由 chunk 的 import 失败只走
          rejection 通道，前三条腿一条都收不到）以及「哪个脚本还在下载」（有 fetch 就有 Resource
          Timing 条目，没条目＝这一跳还在飞）五件它能亲自验的事分别报出来，
          报不出来就只说「没起来」，不写「一定是缓存」这类误导文案；
          ③ 文案给人话＋一个重载按钮，不出现 token／堆栈／内部路径。
         ★★ 2026-10-17 现网第二次实证（同一台访客又交回 ② 读数，而这次指向的是**刚换上去的新入口**，
         不是旧缓存件）⇒ 真身不是某个坏文件，而是**这一跳确实很慢**（跨境取 163 KB 的 br 入口实测
         12.8 s，另有两次 60 s 都没下完；同一台打源站只要几十毫秒）。由此暴露本哨兵自己的两个缺陷：
           · **6s 固定截止把「还在下载」误报成「下载没完成」**——用户被引导去点重新加载，
             而重新加载只会从零再下一遍（慢链路越点越慢）。现改：截止按网络档自适应
             （`navigator.connection` 现读；取不到按默认档），且到期时**只要链路还在动**（Resource
             Timing 条目数又变了）就再等一拍，直到 CEILING_MS 上限；
           · **面板一旦显示就再也不会撤**（旧形态只在「#root 空着」时轮询收摊，`show()` 之后
             #root 才填上的那一档没人管）⇒ 界面其实已经挂载、用户脸上却盖着一块「页面没能加载起来」。
             现改：`#root` 一填上就把哨兵产物撤掉（面板与慢链路横幅都撤）。
           并且把「还在下载」这一类**降级成不挡界面的底部横幅**（它大概率只是慢，不是坏），
           只有站点数据被拒／脚本真失败／执行抛异常这些**确定失效**才盖全屏面板。
         CSP 侧放行内联：deploy/caddy/*.conf 的 script-src 已含 'unsafe-inline'。
         ⚠️ 语法坑（2026-10-12 首跑真踩）：<noscript> 放 <head> 里时 HTML5 解析器进的是
         「in-head noscript」模式，只认 link/style/meta——里面写 <div> 会让 **vite build 当场解析报错**
         （`startTagInHeadNoScript`），界面照常开发热更却根本出不了包。兜底文案必须放 <body>。 -->
    <script>
      (function () {
        var TICK_MS = 400
        var startAt = Date.now()
        // ★ 自适应截止（见上方说明）：网络档现读，取不到就按默认档；CEILING_MS 是「还在动也别无限等」的上限。
        var SLOW_LINK = false
        var connType = ''
        ;(function () {
          try {
            var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection
            if (!c) return
            connType = String(c.effectiveType || '')
            if (typeof c.downlink === 'number' && c.downlink > 0) connType += '/dl' + c.downlink
            if (typeof c.rtt === 'number' && c.rtt > 0) connType += '/rtt' + c.rtt
            if (c.effectiveType === 'slow-2g' || c.effectiveType === '2g' || c.effectiveType === '3g') SLOW_LINK = true
            else if (typeof c.downlink === 'number' && c.downlink > 0 && c.downlink < 1.5) SLOW_LINK = true
            else if (typeof c.rtt === 'number' && c.rtt > 400) SLOW_LINK = true
          } catch (err) { /* 网络档读不到＝不猜，按默认档跑 */ }
        })()
        var DEADLINE_MS = SLOW_LINK ? 30000 : 8000
        var CEILING_MS = 60000
        var lastResCount = -1
        // 「这一跳还在动吗」＝Resource Timing 里的资源条目数有没有再变（变了＝又落了东西，
        // 慢链路正是这个形态）。取不到 Performance API 时返回上一次读数（＝判不出"在动"，不猜）。
        function resCount() {
          try { return performance.getEntriesByType('resource').length } catch (err) { return lastResCount }
        }
        var deadScripts = []
        var uncaught = ''
        var rejected = ''
        // 资源级失败（script/link 没加载成）只在捕获阶段能拿到，必须现在就挂上
        window.addEventListener('error', function (e) {
          var t = e && e.target
          if (t && t.tagName === 'SCRIPT') {
            deadScripts.push(String(t.src || '（内联脚本）'))
          } else if (e && e.message && !uncaught) {
            uncaught = String(e.message)
          }
        }, true)
        // ★ 2026-10-17 补第四件读数：未处理的 Promise 拒绝（unhandledrejection）。
        //   现状实证：路由 chunk 的动态 import 失败抛的是**模块级**异常，它走 rejection 通道、
        //   window.onerror 与上面的捕获阶段 error 都收不到，于是屏幕上只剩「② 没有抓到具体报错，
        //   常见原因是网络中断或浏览器扩展拦截了脚本」——那句话对排障零信息量。
        //   这里把 reason 翻成人能读的一行（Error.message 里就带失败的文件名，
        //   形如「Failed to fetch dynamically imported module: …/Landing-<哈希>.js」——本注释**故意
        //   不写出可被当路径抓取的完整字面量**：换源执行体会把 index.html 里形如构建产物的路径逐个
        //   当"首页引用的 asset"去查落盘，注释里放一个不存在的名字会让它判 BAD、整批换源停在备料段），
        //   仍只取**一条**、不做堆栈、不记录 token（口径同哨兵其余三腿）。
        window.addEventListener('unhandledrejection', function (e) {
          if (rejected) return
          var r = e && e.reason
          var msg = ''
          if (typeof r === 'string') msg = r
          else if (r && r.message) msg = String(r.message)
          else if (r) msg = String(r)
          if (!msg) msg = '（模块没能加载，浏览器没有给出原因）'
          rejected = msg.slice(0, 200)
        })
        // ★ 2026-10-17 补第五件读数：**下载一直没完成的脚本**。
        //   现网那一档「没有抓到任何报错、界面又没起来」最可能的真身是「请求卡住了」——
        //   既不触发 error 事件、也不抛异常，前四条腿一条都收不到。
        //   判据＝该 script 的 src 在 Resource Timing 里**没有条目**（有 fetch 就有条目，哪怕回 404；
        //   没有条目＝这一跳还在飞或压根没发出去）。只报读数，不改任何行为。
        function pendingScripts() {
          var out = []
          var list = document.querySelectorAll('script[src]')
          for (var i = 0; i < list.length; i++) {
            var u = list[i].src || ''
            if (!u) continue
            try {
              if (!performance.getEntriesByName(u).length) out.push(u)
            } catch (err) { /* 取不到就当这条腿不适用，不猜 */ }
          }
          return out
        }
        function rootEmpty() {
          var r = document.getElementById('root')
          return !r || r.childElementCount === 0
        }
        // storageBlocked：亲自拨一次存储，能把「浏览器策略拒绝站点数据」从一堆猜测里单独摘出来
        // （这正是 2026-10-12 那次黑屏的机制：入口包顶层读存储抛 SecurityError）。
        function storageBlocked() {
          var names = []
          var kinds = ['localStorage', 'sessionStorage']
          for (var i = 0; i < kinds.length; i++) {
            try {
              var s = window[kinds[i]]
              s.setItem('__lc_probe', '1')
              s.removeItem('__lc_probe')
            } catch (err) {
              names.push(kinds[i] + '（' + (err && err.name ? err.name : 'Error') + '）')
            }
          }
          return names
        }
        function line(txt, strong) {
          var p = document.createElement('p')
          p.style.margin = '0 0 10px'
          if (strong) p.style.fontWeight = '600'
          p.textContent = txt
          return p
        }
        // ★ 撤哨兵产物：界面挂载上来就撤（旧形态只在「#root 空着」时轮询收摊——`show()` 之后
        //   #root 才填上的那一档没人管，于是界面其实已经好了、用户脸上还盖着「页面没能加载起来」）。
        function dismissBootNotice() {
          var box = document.getElementById('__boot_fail')
          if (box && box.parentNode) box.parentNode.removeChild(box)
        }
        // ★ 撤首屏骨架（见 head 里那段说明的四条口径）：界面挂载即撤、确定失效转全屏面板时也撤；
        //   慢链路横幅那一档**不撤**（那一档本就是「还在加载」，留着转圈才对）。
        function dismissBootSkeleton() {
          var s = document.getElementById('__boot_skeleton')
          if (s && s.parentNode) s.parentNode.removeChild(s)
        }
        function waitedLine() {
          var s = Math.round((Date.now() - startAt) / 1000)
          return '已等待约 ' + s + ' 秒' + (connType ? '（网络档 ' + connType + '）' : '')
        }
        function reloadBtn(css) {
          var b = document.createElement('button')
          b.textContent = '重新加载'
          b.style.cssText = css
          b.onclick = function () { location.reload() }
          return b
        }
        // kind='slow' ⇒ 只是慢（脚本还在下载）：只出**不挡界面的底部横幅**——这一档大概率自己会好，
        //   旧形态把它当失效盖满屏，用户看到的就是「页面没能加载起来」（2026-10-17 报障的真身）。
        // kind='panel'⇒ 确定失效（站点数据被拒／脚本真失败／执行抛异常／什么都没抓到）：盖全屏、信息给全。
        function show(kind) {
          var box = document.getElementById('__boot_fail')
          if (box && kind === 'slow' && box.getAttribute('data-kind') === 'slow') {
            box.parentNode.removeChild(box)
            box = null
          }
          if (box) return
          var pending = pendingScripts()
          if (kind === 'slow') {
            var bar = document.createElement('div')
            bar.id = '__boot_fail'
            bar.setAttribute('data-kind', 'slow')
            bar.setAttribute('role', 'status')
            bar.style.cssText =
              'position:fixed;left:0;right:0;bottom:0;background:#16181C;color:#E7E9EA;' +
              'border-top:1.2px solid #6E7683;padding:12px 16px;z-index:99999;' +
              'font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif'
            bar.appendChild(line('界面还在加载：' + waitedLine() + '。' +
              (pending.length ? '还在下载：' + pending.slice(0, 2).join('；') : '界面脚本还没下载完') +
              '。本站网络偏慢时入口脚本要十几秒，请再等一会儿；若一直不进，点这里重新加载（会从头再下一遍）。'))
            bar.appendChild(reloadBtn('margin-top:8px;padding:8px 16px;font:14px/1 system-ui,sans-serif;' +
              'background:none;color:#E7E9EA;border:1.2px solid #6E7683;border-radius:8px;cursor:pointer'))
            ;(document.body || document.documentElement).appendChild(bar)
            return
          }
          box = document.createElement('div')
          box.id = '__boot_fail'
          box.setAttribute('data-kind', 'panel')
          box.setAttribute('role', 'alert')
          // 确定失效：骨架撤掉再去盖面板（否则错误文案背后一直有个转圈在空转，像还在加载）
          dismissBootSkeleton()
          box.style.cssText =
            'position:fixed;inset:0;background:#0B0C0E;color:#E7E9EA;padding:32px;' +
            'font:15px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif;z-index:99999;overflow:auto'
          box.appendChild(line('页面没能加载起来', true))
          box.appendChild(line('标题能显示说明站点本身是通的，是界面脚本这一步没跑完（' + waitedLine() + '）。下面这几条是刚才实测到的，可以直接拿给技术支持。'))
          var blocked = storageBlocked()
          if (blocked.length) {
            box.appendChild(line('① 这台浏览器拒绝本站保存数据：' + blocked.join('、') + '。请在 Edge/Chrome 的「Cookie 和网站数据」里允许本站保存数据（隐私模式或「阻止所有 Cookie」会命中这一条），然后重新加载。'))
          }
          if (deadScripts.length) {
            box.appendChild(line('② 有脚本没能加载：' + deadScripts.slice(0, 3).join('；') + '。多半是这一跳网络断了，或浏览器扩展拦下了这个文件；重新加载通常就能恢复。'))
          } else if (pending.length) {
            box.appendChild(line('② 有个脚本的下载一直没完成：' + pending.slice(0, 2).join('；') + '。多半是这一跳网络太慢或被卡住了（也可能是浏览器扩展拦下了这个文件），点下面重新加载；仍旧不行请把这一行原样交给技术支持。'))
          }
          if (uncaught) {
            box.appendChild(line('③ 脚本执行时出错：' + uncaught))
          }
          if (rejected) {
            box.appendChild(line('④ 有个界面模块没能加载（多半是加载那一瞬间网络断了，或浏览器扩展拦下了这个文件）：' + rejected + '。重新加载通常就能恢复。'))
          }
          if (!blocked.length && !deadScripts.length && !pending.length && !uncaught && !rejected) {
            box.appendChild(line('② 没有抓到具体报错，常见原因是网络中断或浏览器扩展拦截了脚本。'))
          }
          box.appendChild(reloadBtn('margin-top:8px;padding:10px 20px;font:15px/1 system-ui,sans-serif;' +
            'background:#FFFFFF;color:#0B0C0E;border-radius:8px;cursor:pointer'))
          ;(document.body || document.documentElement).appendChild(box)
        }
        var timer = setInterval(function () {
          if (!rootEmpty()) { clearInterval(timer); dismissBootNotice(); dismissBootSkeleton(); return }
          if (Date.now() - startAt < DEADLINE_MS) return
          // 到期了：先问「这一跳还在动吗」——还有脚本在下载时，**只要链路还在动就再等一拍**
          // （慢链路上 Resource Timing 条目数会陆续增加）；直到 CEILING_MS 上限。
          var pending = pendingScripts()
          var n = resCount()
          var progressed = n !== lastResCount
          lastResCount = n
          var definitive = !!(deadScripts.length || rejected || uncaught || storageBlocked().length)
          if (!definitive && pending.length) {
            if (Date.now() - startAt < CEILING_MS) {
              show('slow')
              DEADLINE_MS = Math.min(Date.now() - startAt + 8000, CEILING_MS)
              return
            }
          } else if (progressed && Date.now() - startAt < CEILING_MS) {
            // 判不出确定失效、又没有"在下载的脚本"：只在链路明显还在动时多给一拍（避免误报）
            DEADLINE_MS = Math.min(Date.now() - startAt + 8000, CEILING_MS)
            return
          }
          clearInterval(timer)
          show('panel')
        }, TICK_MS)
      })()
    </script>
  </head>

      <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0B0C0E;color:#E7E9EA;padding:32px;font:15px/1.7 system-ui,-apple-system,'Segoe UI',sans-serif;z-index:99998">
        本站需要浏览器启用 JavaScript 才能显示。请在 Edge/Chrome 的设置里允许本站点运行脚本后重新加载。
      </div>
    </noscript>
    <div id="__boot_skeleton" class="lc-boot-cover" aria-hidden="true"><span class="lc-boot-spin"></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
