# 主站与 AI 顾问的文件日志轮转（★ 2026-09-23 磁盘清理批新增）
#
# 为什么需要：`translator.service` / `ai-assist.service` 都用 systemd 的
# `StandardOutput=append:<文件>` 把 slog JSON 直接追加到文件（主站
# `/opt/translator/log/translator.log`、顾问 `/opt/ai-assist/data/assist.log`），
# 进程全程持有同一个 fd。2026-09-23 清理时主站日志已长到 **2.85 GB**（占整盘 7%），
# 而服务器上 `/etc/logrotate.d/` 里根本没有对应条目——也就是「除了手动 gzip + 截断，
# 没有任何机制会回收它」。补上这个文件就是根治。
#
# 关键口径（勿改成别的写法，否则会静默失效）：
# - `copytruncate`：fd 由 systemd 以 root 打开后交给降权进程，进程既不会重开日志、
#   `assist.log` 还是 root:root（translator 用户没写权限，靠继承的 fd 写），
#   所以只能「复制一份再原地截断」。默认的子命令式 create + `systemctl restart` 会把
#   正在跑的请求日志切丢，也可能触发一次不必要的重启。
# - **不要加 `su translator translator`**：copytruncate 不新建文件，加 su 反而会让
#   translator 用户在 root:root 的 `assist.log` 上截断失败（静默不轮转）。
# - `maxsize 200M` + `daily`：两条件是「或」关系——日常按天轮，突发流量当天超 200M 也轮，
#   避免又一次长到 GB 级才被发现。
# - `rotate 7`：只留 7 份压缩归档（约 1.4G 上限），更久的排障价值低于磁盘成本。
#
# 安装（服务器 root，幂等）：
#   install -m 0644 deploy/logrotate/translator.conf /etc/logrotate.d/translator
#   logrotate -d /etc/logrotate.d/translator        # 先干跑看判定
#   logrotate -f /etc/logrotate.d/translator        # 强制一次，确认两份日志出现 .1 且服务仍在写
/opt/translator/log/translator.log
/opt/ai-assist/data/assist.log
{
    daily
    maxsize 200M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
