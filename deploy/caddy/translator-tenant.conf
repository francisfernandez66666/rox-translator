# ================= 租户品牌域名 *.lexicorn.cn（F-73 修复，2026-09-27 〇-W） =================
# 独立 Caddyfile 片段：通过主 Caddyfile 末尾的 `import /etc/caddy/translator-tenant.conf` 引入。
#
# ── 这条链要解决什么（缺陷 F-73）────────────────────────────────────────────
# 「按访问域名解析租户品牌」在后端早就通了（spa.go serveIndexHTML → brandingPayload →
# tenants.domain 反查），但生产 Caddy 只有 langcross / rox-test 两条**精确**站点块，
# 没有任何通配块 ⇒ 客户打开自己的品牌域要么 525（CF 与源站 TLS 握手失败）、要么 200 空体，
# F-71 实装的租户品牌背景图/登录壳在客户入口根本到不了浏览器。本文件补上这一段。
#
# ── 与主站块（translator.conf）的两处刻意差异 ───────────────────────────────
#  ① 兜底段用 `reverse_proxy 127.0.0.1:8787`，**不是** `file_server`：
#     首页必须由后端直出，才会在 index.html 里注入 window.__BRANDING__（F-74 的教训——
#     主站今天正是被 Caddy 静态直出绕掉了注入，只剩前端异步兜底，会出现「先通用后品牌」闪烁）。
#     /assets/* 仍由 Caddy 直接落盘服务（带哈希长缓存），不进后端，避免每个 JS 都过一次 Go。
#  ② 只服务租户域，不复制主站的 /metrics 等运维口子（本来就没开）。
#
# ── 证书口径（分两步上线，务必看懂再动）────────────────────────────────────
# 当前生效行是 `tls internal`：Caddy 本地 CA 自签，**只为把源站这半边接通并做接线验收**
# （源站本机 `curl -k --resolve <租户域>:443:127.0.0.1` 可验），对客户不可用——
# Cloudflare 若为 Full(strict) 会拒（526），且本zone 已开 Always Use HTTPS，
# LE 的 HTTP-01 会被 308 到 https 而形成「没证书→拿不到证书」的死锁，所以不能用 ACME 自动签。
# 正式口径＝换成 Cloudflare **Origin CA 证书**（域名写 `*.lexicorn.cn`，Full(strict) 认它）：
#     1) CF 控制台 → SSL/TLS → 源站服务器 → 创建证书（CSR 自动生成，有效期 15 年）；
#     2) 源站建目录并落两个文件（密钥权限收紧，只有 root 可读）：
#          mkdir -p /etc/caddy/tls && chmod 700 /etc/caddy/tls
#          # 粘贴 CF 给的 源站证书 → /etc/caddy/tls/tenant-origin.crt
#          # 粘贴 CF 给的 私钥      → /etc/caddy/tls/tenant-origin.key && chmod 600 这两个文件
#     3) 把下面的 `tls internal` 改成 `tls /etc/caddy/tls/tenant-origin.crt /etc/caddy/tls/tenant-origin.key`；
#     4) caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy。
# ⚠️ 不要把 Origin CA 私钥粘进聊天/文档/git —— 它只能存在于源站磁盘上。
#
# ── 未登记子域的行为 ────────────────────────────────────────────────────────
# 通配块会接住任意 `*.lexicorn.cn`，但**品牌仍按 Host 问后端**：
# tenants.domain 没登记的域名拿不到任何租户定制（brandingPayload 回落平台默认），
# 所以不存在「猜个子域就看到别人品牌」的串号；证书层面 wildcard 一张通吃，不消耗 LE 配额
# （这也是不用 on_demand_tls 的原因——本区 CF 强制 https 跳转会让 HTTP-01 永远签不下来）。
# ── rox.lexicorn.cn 退役（★ 2026-10-30 用户令：该站不再使用）──────────────────
# 该主机名**没有任何租户绑定**（tenants.domain 里只有默认租户与比亚迪），
# 过去靠下面的通配块接住、按平台默认品牌出首页。退役后源站直接回 410：
# 不再打到应用，也不再让访客以为这是个能用的站。
# ⚠️ 真正的下线还要在 Cloudflare 删掉这条 DNS 记录（源站够不着那一层）；
#    DNS 删掉之前，本块保证它无论如何都不会再返回站点内容。
# ⚠️ **不要照这个形态退役 `rox-test.lexicorn.cn`**：那是**演示站**（translator-demo.conf 的精确块）。
rox.lexicorn.cn {
	tls internal
	respond "This site has been retired." 410
}

*.lexicorn.cn {
	encode gzip

	# —— 安全响应头基线：与主站逐字一致（D6 评审口径，租户域不得弱于主站）——
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
		# ★ 2026-10-17：与主站同口径放开 microphone=(self)，令租户品牌域上的即时翻译也能录音。
		Permissions-Policy "camera=(), microphone=(self), geolocation=()"
		-Server
	}

	# CSP 互斥分流（同主站：matcher 必须定义在 header{} 块外，块内是无效语法且 validate 静默放过）
	@tenant_strict_csp not path /assist-api/*
	# ★ 2026-10-17：与主站逐字同源的两处收紧补丁（WASM 编译 + 朗读 blob 音频）——
	#   租户域不得弱于主站，也不得漏掉同两项能力，否则「主站能录音/能朗读、品牌域不能」。
	# ★ 同日第二批（同主站，逐字同源）：为 Cloudflare 挑战平台/Turnstile 放行 'unsafe-eval'
	#   ＋ connect-src data: ＋ worker-src 'self' blob:——理由与逐条口径见 translator.conf 同段注释。
	header @tenant_strict_csp Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://static.geetest.com https://appsforoffice.microsoft.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data: https://challenges.cloudflare.com https://static.geetest.com https://gcaptcha4.geetest.com; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com https://static.geetest.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
	header @tenant_strict_csp X-Frame-Options "DENY"
	header /assist-api/* X-Frame-Options "SAMEORIGIN"
	header /assist-api/* Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'"

	# 支付渠道异步回调：注入内部凭证后反代（须放在 /api/* 通配之前，精确路径优先）
	handle /api/pay/notify/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
			header_up X-Admin-Token "{$TRANSLATOR_ADMIN_TOKEN}"
		}
	}

	handle /api/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}

	# AI 销售/客服挂件与管理台（与主站同源逻辑；挂件按 Host 归到该 Host 解析出的租户）
	handle /assist-api/* {
		uri strip_prefix /assist-api
		reverse_proxy 127.0.0.1:8790 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}

	handle /status {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}
	handle /openapi/v1/tasks* {
		request_body {
			max_size 40MB
		}
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}
	handle /openapi/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}
	handle /office/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}
	handle /pricing {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}
	handle /docs/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}

	# 带哈希的静态资源：源站落盘直出（与主站同一份 dist），一年不可变缓存
	handle /assets/* {
		root * /opt/translator/web
		# ★ 2026-10-12 CF 404 钉缓存事故修法：长缓存只在**磁盘上真有这个文件**时发。
		#   旧形态无条件发，于是任何一次探到不存在的哈希名都会连 404 一起被边缘缓存钉一年。
		@asset file {http.request.uri.path}
		header @asset Cache-Control "public, max-age=31536000, immutable"
		# ★ 2026-10-12 慢链路批②：与主站段逐字同口径的**预压缩侧车**直出
		#   （`node scripts/precompress_dist.mjs` 在发版机生成 `.br`/`.gz`，随 dist 一起上线）。
		#   这一份 dist 与主站是**同一个目录**（root 都指向 /opt/translator/web），
		#   所以客户品牌域名的首屏 JS 与主站吃同一份省下来的字节；
		#   ⚠️ 也正因为共用磁盘，任何一次"只在主站跑预压缩、只在租户域校验"都不算数——
		#   发版验收要**两域各测一次**（详见《部署指南》换源段的 br 判据）。
		#   三条实测口径（隔离实例 127.0.0.1:8099 现读，配置 `admin off`＋独立端口）：
		#   列表顺序＝偏好顺序（`br gzip` ⇒ 客户端写 `gzip, br` 也回 br）；会带 `Vary: Accept-Encoding`；
		#   侧车不在 ⇒ **静默回落原文/gzip、不报错**，所以换源前必须过 `--check`。
		#   语法：`precompressed` 必须**块内单独一行**，与 `{` 同行会 adapt 失败。
		file_server {
			precompressed br gzip
		}
	}
	# ★ 2026-10-12 CF 404 钉缓存事故修法（第二条腿）：/assets/* 的**错误响应**一律 no-store。
	#   源站对不存在的哈希名原本回「无任何 cache-control」，Cloudflare 仍按默认档把它钉住
	#   （实测 4 小时 cf-cache-status: HIT）；显式 no-store 才能让边缘彻底不缓存一次 404。
	#   隔离实例现读对照：加这一段前后，/ 与 /assets/<存在件> 与死上游 502 的响应一字不差，
	#   只有 /assets/<不存在件> 多出 `Cache-Control: no-store` ⇒ 射程仅限这一族错误页。
	handle_errors {
		@asseterr path /assets/*
		header @asseterr Cache-Control "no-store"
	}

	# ★ 其余全部交后端：首页在这里拿到 window.__BRANDING__（按 Host 解析租户），
	#   /brand/*、/extensions/*、/sdk/* 也由后端自己的静态分支直出。
	handle {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}

	request_body {
		max_size 10MB
	}

	# 租户域单独一份访问日志（不与主站混写，排障时按域名直接定位；空目录时 Caddy 自建）
	log {
		output file /var/log/caddy/translator-tenant.access.log {
			roll_size 10MiB
			roll_keep 5
		}
	}

	tls internal
}
