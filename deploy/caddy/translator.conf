# ================= 翻译助手 langcross.lexicorn.cn =================
# 独立 Caddyfile 片段：通过主 Caddyfile 的 `import /etc/caddy/translator.conf` 引入。
# 缓存策略：index.html 不缓存（部署即生效）；/assets/* 带哈希长缓存。
#
# ★ 安全基线（2026-08-26 全仓评审 D6）：
#   ① 全站安全响应头（HSTS/nosniff/frame-ancestors/Referrer-Policy）——
#      此前一项都没有，管理后台 SPA 可被任意 iframe 嵌套点击劫持；
#   ② 支付回调凭证不再写进本文件——改为引用 Caddy 环境变量
#      {$TRANSLATOR_ADMIN_TOKEN}。旧方案把占位符替换成真实值后 chmod 644，
#      等于把回调凭证公开在磁盘上（且极易连同配置提交进 git）。配置步骤：
#        a. 在 /etc/default/caddy 追加一行（文件权限 600，caddy 服务重启自动加载）：
#             TRANSLATOR_ADMIN_TOKEN=<与 translator secrets.env 的 ADMIN_TOKEN 相同值>
#        b. chown root:caddy /etc/default/caddy && chmod 640 /etc/default/caddy
#        c. caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy
#
# ★★ 本文件与线上 /etc/caddy/translator.conf 的同源口径（2026-09-27 〇-X F-74 立）：
#   此前线上被直接改过两轮（F-30 XFF 修复、早期遗留的 /pricing 专项代理），本文件没跟上，
#   于是"仓库里那份"不能当发版输入用。本次以线上实读文件为底重锚，并只叠加 F-74 一处改动。
#   以后改线上 Caddy 必须同批改本文件；发版前用
#     ssh … 'cat /etc/caddy/translator.conf' | diff - deploy/caddy/translator.conf
#   比一次，差异必须能被本文件的注释解释。
langcross.lexicorn.cn {
	encode gzip

	# —— 安全响应头基线（D6）——
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		# X-Frame-Options 已移出本块（matcher 语法限制）：见下方分流（严格 DENY / assist SAMEORIGIN）。
		Referrer-Policy "strict-origin-when-cross-origin"
		# ★ 2026-10-17：microphone 由 () 放开为 (self) —— ()=禁用所有来源，
		#   即时翻译的「麦克风录音」（getUserMedia）会被 Permissions-Policy 直接拒，
		#   表现是点录音必失败（并连带端侧 WASM 识别无麦可用）。只开本域，仍禁 camera/geolocation。
		Permissions-Policy "camera=(), microphone=(self), geolocation=()"
		# CSP 已移出本块（header 块内不支持 matcher 语法，块内同名 header 无覆盖语义）：
		# 见下方 @strict_csp 互斥分流（2026-09-16 管理台 iframe 被整站 CSP 拒嵌踩坑）。
		# - script-src 含 static.cloudflareinsights.com（Cloudflare Web Analytics beacon 注入）；
		# - /assist-api/* 用宽松版（管理台被主站同源 iframe 嵌入，frame-ancestors self）；
		# - 其余路径严格版（frame-ancestors none）；img-src https: 放行收款码外链。
		# - script-src 暂保留 'unsafe-inline'——后端渲染页/品牌注入/office taskpane 均内联脚本，
		#   待统一改 nonce 后收紧。
		-Server
	}

	# ★ CSP 互斥分流（2026-09-16）：matcher 必须定义在 header{} 块外（块内为无效语法，
	#   validate 静默通过但完全不生效——实测踩坑）。两条互斥：/assist-api 宽松、其余严格。
	@strict_csp not path /assist-api/*
	# ★ 2026-10-17 两处收紧补丁（均为放行**本域自有**能力，不引入外部来源）：
	#   · script-src 增 'wasm-unsafe-eval'：端侧 sherpa-onnx WASM 的 WebAssembly.instantiateStreaming
	#     在无该关键字时被 CSP 判为违反 unsafe-eval 而整块编译失败（现网控制台实证）；
	#     它是「允许 WASM 编译」的专用关键字，比放开 unsafe-eval 收敛得多（胶水层无 eval/new Function）。
	#   · media-src 'self' blob: 新增：译文朗读把 TTS 字节包成 blob URL 喂 <audio>，
	#     此前无 media-src 指令 ⇒ 回落 default-src 'self' ⇒ blob: 被拒 ⇒ 点朗读无声也不报错。
	# ★ 2026-10-17 第二批（用户报障：登录前页面 CSP 报错）——Cloudflare 挑战平台/Turnstile 的硬要求：
	#   · script-src 增 'unsafe-eval'：挑战平台的托管脚本用了字符串求值，官方口径＝受保护页面必须放 'unsafe-eval'，
	#     否则报「Content Security Policy of your site blocks the use of eval」并可能整页白屏（cloudflare-docs#17786）；
	#     这是**为第三方挑战放行**，与上面的 'wasm-unsafe-eval'（只为办自家 WASM 编译）不是一回事，两者都要在。
	#   · connect-src 增 data: ＋ worker-src 'self' blob:：挑战平台的 attestation 走 fetch('data:…')、并起 worker，
	#     缺少它们同样在控制台报 connect-src 被拦（用户实拍 Issues 面板）。
	header @strict_csp Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://static.geetest.com https://appsforoffice.microsoft.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data: https://challenges.cloudflare.com https://static.geetest.com https://gcaptcha4.geetest.com; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com https://static.geetest.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
	header /assist-api/* Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
	# X-Frame-Options 与 CSP 同口径分流：现代浏览器 frame-ancestors 优先，此处兜底旧内核
	header @strict_csp X-Frame-Options "DENY"
	header /assist-api/* X-Frame-Options "SAMEORIGIN"

	# 支付渠道异步回调：注入内部凭证后反代（须放在 /api/* 通配之前，精确路径优先）
	handle /api/pay/notify/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
			header_up X-Admin-Token "{$TRANSLATOR_ADMIN_TOKEN}"
		}
	}

	# 后端 API / SSE（反代到翻译助手 127.0.0.1:8787）
	# ★ 每个反代段都带 XFF（F-30 修法，2026-09-26 线上实装后本次回写仓库）：
	#   站点在 Cloudflare 后面，Caddy 不覆写 X-Forwarded-For 时，后端看到的客户端 IP
	#   全是 127.0.0.1 —— 登录失败计数 / 注册 IP 日限 / 留资频控全部按 IP 生效，
	#   等于对单攻击者无限流、对出口 IP 共享的用户群误伤。取值只用 CF-Connecting-IP
	#   （Cloudflare 覆写过的头，客户端伪造不了），不信任客户端自带的 X-Forwarded-For。
	handle /api/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}

	# ★ /metrics 不再公网暴露（2026-08-26 评审整改 D1）：
	#   Prometheus 改内网抓取（服务器本机 curl 127.0.0.1:8787/metrics 或 SSH 隧道）；
	#   如需恢复公网，须先在后端配置 METRICS_TOKEN 并在此处透传 Authorization 头。
	# handle /metrics {
	# 	reverse_proxy 127.0.0.1:8787
	# }
	# ★ autosales（2026-09-16）：ai-assist 独立服务（AI 销售/客服挂件与管理台）
	#   systemd: ai-assist.service（/opt/ai-assist，密钥 /etc/ai-assist/secrets.env）
	# ★ 2026-10-30 三事合一批 组7（D-14 路 A′）：/assist-api/* 改由**主服务**接一跳再转 assist。
	#   目的：主服务用它自己已校验的会话组装画像、签 HMAC 后放进内部头，assist 只验签不查主库。
	#   回滚位：把 8787 改回 8790（画像消失、挂件照常，见方案 §10）——这是唯一可单独回滚的一段。
	handle /assist-api/* {
		# ★ 2026-10-31 修正：这里**不许再剥前缀**。主服务把这条面注册在
		#   `assistOpenPrefix + "/"`＝`/assist-api/` 上（server.go），剥掉之后变成
		#   `/chat`、`/admin/...` 这类主服务根本没有的路径 ⇒ 落进 SPA 兜底，
		#   挂件与画像链路整体失效且响应仍是 200（无任何报错）。
		#   旧配置直转 8790（assist 自己的路由就是剥过前缀的）时才需要这一行。
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
			# ★ P-7：任何仍直转的路径都必须先删同名头——客户端自带伪造的画像头必须无效。
			# 主服务转发段自己也会再删一次（两道，任一在都成立）。
			header_up -X-Assist-Profile
			header_up -X-Assist-Profile-Ts
			header_up -X-Assist-Profile-Sig
		}
	}

	handle /status {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}
	# 开放 API 任务接口：文件批量上传放宽请求体上限（其余路径仍受全站限制约束）
	handle /openapi/v1/tasks* {
		request_body {
			max_size 40MB
		}
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}
	handle /openapi/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}
	handle /office/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}
	# 合规文档页（条款/SLA/隐私）与商业静态页由后端渲染，走后端而非 SPA 兜底
	# ★ P2-6（2026-09-18）：/pricing 已归一到 SPA（原 Go 服务端渲染块删除）；
	#   线上那段时间残留的 `handle /pricing` 专项代理段于 2026-09-27 随 F-74 一并按
	#   "兜底段整体走后端"的口径删除——两条路径的上游与 header_up 完全相同，留着只会
	#   让人以为 /pricing 有特殊接线（真实历史：那段配置比仓库新，见文件头同源口径）。
	handle /docs/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}

	# 带哈希的静态资源：一年不可变缓存
	handle /assets/* {
		root * /opt/translator/web
		# ★ 2026-10-12 CF 404 钉缓存事故修法：长缓存只在**磁盘上真有这个文件**时发。
		#   旧形态无条件发，于是任何一次探到不存在的哈希名都会连 404 一起被边缘缓存钉一年。
		@asset file {http.request.uri.path}
		header @asset Cache-Control "public, max-age=31536000, immutable"
		# ★ 2026-10-12 慢链路批②：直出**预压缩侧车**（`<文件>.br` / `<文件>.gz`，发版机上由
		#   `node scripts/precompress_dist.mjs` 生成、随 dist 一起 tar 上线）。
		#   为什么值得动这一行：现网瓶颈是「大陆 → CF 免费版 → 美西」那条被实测压到 KB/s 的链，
		#   杠杆只有字节数——本机实测同一份入口件 gzip 196,179 B → brotli 159,760 B（再省 18.6%），
		#   全部 37 个文本资产 3,357,710 B → 813,717 B。另一半收益是 TTFB：侧车是现成字节，
		#   不再把压缩时间摊进请求线程。
		#   三条实测口径（127.0.0.1:8099 隔离实例现读，配置里 `admin off`＋独立端口，绝不碰现役 2019）：
		#   ① **偏好由这里的列表顺序决定，不由客户端顺序决定**——`Accept-Encoding: gzip, br` 仍回 br，
		#      所以 `br gzip` 这个次序就是"优先 brotli、回落 gzip"，别再往后加一档以为要调权重；
		#   ② Caddy 会带 `Vary: Accept-Encoding`（CF 该 Vary 会进缓存键，两种编码不会互相污染）；
		#   ③ **侧车不在就静默回落**：无 `.br` 而客户端只认 br ⇒ 原样恒等发出；有 `.gz` 而客户端两种都认 ⇒ 回 gzip。
		#      这条回落没有日志、界面也照常 ⇒ 预压缩没跑等于"省下的字节没上线"，
		#      所以换源前必须过 `node scripts/precompress_dist.mjs --check`（判据现算，不只查在位）。
		#   ⚠️ 语法：`precompressed` 只能写在 `file_server { … }` **块内单独一行**；
		#      与 `{` 同行（`file_server { precompressed br gzip }`）会在 adapt 期直接报
		#      「Unexpected next token after '{' on same line」——本行就是那样试过才钉下来的。
		#   ⚠️ 侧车**比原文大**时 Caddy 照发不误（实测 14 B 原文发出 220 B 的 `.br`），
		#      所以生成侧车那一步的"更小才落盘"判据是这条链唯一的体积安全阀，不许放宽。
		file_server {
			precompressed br gzip
		}
	}
	# ★ 2026-10-12 CF 404 钉缓存事故修法（第二条腿）：/assets/* 的**错误响应**一律 no-store。
	#   源站对不存在的哈希名原本回「无任何 cache-control」，Cloudflare 仍按默认档把它钉住
	#   （实测 4 小时 cf-cache-status: HIT）；显式 no-store 才能让边缘彻底不缓存一次 404。
	#   隔离实例现读对照：加这一段前后，/ 与 /assets/<存在件> 与死上游 502 的响应一字不差，
	#   只有 /assets/<不存在件> 多出 `Cache-Control: no-store` ⇒ 射程仅限这一族错误页。
	handle_errors {
		@asseterr path /assets/*
		header @asseterr Cache-Control "no-store"
	}

	# ★★ F-74（2026-09-27 〇-X 第 3 项「主站首页也走后端」）：兜底段由 file_server 改成反代。
	#   根因：`window.__BRANDING__` 由后端 spa.go 的 serveIndexHTML **无条件**注入，
	#   而主站首页此前由 Caddy `file_server` 静态直出 ⇒ 首页永远拿不到注入值，
	#   平台品牌只剩前端异步兜底（首屏先通用品牌、接口回来再换），且主站与租户域名的
	#   首页出自两套实现——租户域名早在 F-73 就是这么接的（AGENTS §一·5 三条硬口径①：
	#   通配块兜底段必须 reverse_proxy，不许写回 file_server）。本次把主站拉到同一口径。
	#   代价与边界：非 /assets 的零散静态件（favicon、robots.txt、taskpane 之外的散件）
	#   改由后端读 dist 直出（spa.go 原有逻辑，租户域名已在生产验证过）；
	#   带哈希的 /assets/* 仍由 Caddy 落盘直出，反代不吃打包资源的带宽。
	#   缓存头不再由 Caddy 写：spa.go 对 index.html 与非 /assets 资源一律 no-cache，
	#   语义与本段旧值（no-cache, must-revalidate）等价，且与租户域名一致。
	handle {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}

	request_body {
		max_size 10MB
	}

	log {
		output file /var/log/caddy/translator.access.log {
			roll_size 10MiB
			roll_keep 5
		}
	}
}
