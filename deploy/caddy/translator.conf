# ================= 翻译助手 langcross.lexicorn.cn =================
# 独立 Caddyfile 片段：通过主 Caddyfile 的 `import /etc/caddy/translator.conf` 引入。
# 缓存策略：index.html 不缓存（部署即生效）；/assets/* 带哈希长缓存。
#
# ★ 安全基线（2026-08-26 全仓评审 D6）：
#   ① 全站安全响应头（HSTS/nosniff/frame-ancestors/Referrer-Policy）——
#      此前一项都没有，管理后台 SPA 可被任意 iframe 嵌套点击劫持；
#   ② 支付回调凭证不再写进本文件——改为引用 Caddy 环境变量
#      {$TRANSLATOR_ADMIN_TOKEN}。旧方案把占位符替换成真实值后 chmod 644，
#      等于把回调凭证公开在磁盘上（且极易连同配置提交进 git）。配置步骤：
#        a. 在 /etc/default/caddy 追加一行（文件权限 600，caddy 服务重启自动加载）：
#             TRANSLATOR_ADMIN_TOKEN=<与 translator secrets.env 的 ADMIN_TOKEN 相同值>
#        b. chown root:caddy /etc/default/caddy && chmod 640 /etc/default/caddy
#        c. caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy
langcross.lexicorn.cn {
	encode gzip

	# —— 安全响应头基线（D6）——
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		X-Frame-Options "DENY"
		Referrer-Policy "strict-origin-when-cross-origin"
		Permissions-Policy "camera=(), microphone=(), geolocation=()"
		# 去除 Server 头指纹
		-Server
	}

	# 支付渠道异步回调：注入内部凭证后反代（须放在 /api/* 通配之前，精确路径优先）
	handle /api/pay/notify/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Admin-Token "{$TRANSLATOR_ADMIN_TOKEN}"
		}
	}

	# 后端 API / SSE（反代到翻译助手 127.0.0.1:8787）
	handle /api/* {
		reverse_proxy 127.0.0.1:8787
	}

	# ★ /metrics 不再公网暴露（2026-08-26 评审整改 D1）：
	#   Prometheus 改内网抓取（服务器本机 curl 127.0.0.1:8787/metrics 或 SSH 隧道）；
	#   如需恢复公网，须先在后端配置 METRICS_TOKEN 并在此处透传 Authorization 头。
	# handle /metrics {
	# 	reverse_proxy 127.0.0.1:8787
	# }
	handle /status {
		reverse_proxy 127.0.0.1:8787
	}
	# 开放 API 任务接口：文件批量上传放宽请求体上限（其余路径仍受全站限制约束）
	handle /openapi/v1/tasks* {
		request_body {
			max_size 35MB
		}
		reverse_proxy 127.0.0.1:8787
	}
	handle /openapi/* {
		reverse_proxy 127.0.0.1:8787
	}
	handle /office/* {
		reverse_proxy 127.0.0.1:8787
	}
	# 商业静态页（定价/条款/SLA/隐私）由后端渲染，走后端而非 SPA 兜底
	handle /pricing {
		reverse_proxy 127.0.0.1:8787
	}
	handle /docs/* {
		reverse_proxy 127.0.0.1:8787
	}

	# 带哈希的静态资源：一年不可变缓存
	handle /assets/* {
		root * /opt/translator/web
		header Cache-Control "public, max-age=31536000, immutable"
		file_server
	}

	# 其余全部走 SPA：index.html 强制不缓存
	handle {
		root * /opt/translator/web
		try_files {path} /index.html
		header Cache-Control "no-cache, must-revalidate"
		file_server
	}

	request_body {
		max_size 10MB
	}

	log {
		output file /var/log/caddy/translator.access.log {
			roll_size 10MiB
			roll_keep 5
		}
	}
}
