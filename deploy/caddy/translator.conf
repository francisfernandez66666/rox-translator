# ================= 翻译助手 langcross.lexicorn.cn =================
# 独立 Caddyfile 片段：通过主 Caddyfile 的 `import /etc/caddy/translator.conf` 引入。
# 缓存策略：index.html 不缓存（部署即生效）；/assets/* 带哈希长缓存。
#
# ★ 安全基线（2026-08-26 全仓评审 D6）：
#   ① 全站安全响应头（HSTS/nosniff/frame-ancestors/Referrer-Policy）——
#      此前一项都没有，管理后台 SPA 可被任意 iframe 嵌套点击劫持；
#   ② 支付回调凭证不再写进本文件——改为引用 Caddy 环境变量
#      {$TRANSLATOR_ADMIN_TOKEN}。旧方案把占位符替换成真实值后 chmod 644，
#      等于把回调凭证公开在磁盘上（且极易连同配置提交进 git）。配置步骤：
#        a. 在 /etc/default/caddy 追加一行（文件权限 600，caddy 服务重启自动加载）：
#             TRANSLATOR_ADMIN_TOKEN=<与 translator secrets.env 的 ADMIN_TOKEN 相同值>
#        b. chown root:caddy /etc/default/caddy && chmod 640 /etc/default/caddy
#        c. caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy
#
# ★★ 本文件与线上 /etc/caddy/translator.conf 的同源口径（2026-09-27 〇-X F-74 立）：
#   此前线上被直接改过两轮（F-30 XFF 修复、早期遗留的 /pricing 专项代理），本文件没跟上，
#   于是"仓库里那份"不能当发版输入用。本次以线上实读文件为底重锚，并只叠加 F-74 一处改动。
#   以后改线上 Caddy 必须同批改本文件；发版前用
#     ssh … 'cat /etc/caddy/translator.conf' | diff - deploy/caddy/translator.conf
#   比一次，差异必须能被本文件的注释解释。
langcross.lexicorn.cn {
	encode gzip

	# —— 安全响应头基线（D6）——
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		# X-Frame-Options 已移出本块（matcher 语法限制）：见下方分流（严格 DENY / assist SAMEORIGIN）。
		Referrer-Policy "strict-origin-when-cross-origin"
		Permissions-Policy "camera=(), microphone=(), geolocation=()"
		# CSP 已移出本块（header 块内不支持 matcher 语法，块内同名 header 无覆盖语义）：
		# 见下方 @strict_csp 互斥分流（2026-09-16 管理台 iframe 被整站 CSP 拒嵌踩坑）。
		# - script-src 含 static.cloudflareinsights.com（Cloudflare Web Analytics beacon 注入）；
		# - /assist-api/* 用宽松版（管理台被主站同源 iframe 嵌入，frame-ancestors self）；
		# - 其余路径严格版（frame-ancestors none）；img-src https: 放行收款码外链。
		# - script-src 暂保留 'unsafe-inline'——后端渲染页/品牌注入/office taskpane 均内联脚本，
		#   待统一改 nonce 后收紧。
		-Server
	}

	# ★ CSP 互斥分流（2026-09-16）：matcher 必须定义在 header{} 块外（块内为无效语法，
	#   validate 静默通过但完全不生效——实测踩坑）。两条互斥：/assist-api 宽松、其余严格。
	@strict_csp not path /assist-api/*
	header @strict_csp Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://appsforoffice.microsoft.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
	header /assist-api/* Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
	# X-Frame-Options 与 CSP 同口径分流：现代浏览器 frame-ancestors 优先，此处兜底旧内核
	header @strict_csp X-Frame-Options "DENY"
	header /assist-api/* X-Frame-Options "SAMEORIGIN"

	# 支付渠道异步回调：注入内部凭证后反代（须放在 /api/* 通配之前，精确路径优先）
	handle /api/pay/notify/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
			header_up X-Admin-Token "{$TRANSLATOR_ADMIN_TOKEN}"
		}
	}

	# 后端 API / SSE（反代到翻译助手 127.0.0.1:8787）
	# ★ 每个反代段都带 XFF（F-30 修法，2026-09-26 线上实装后本次回写仓库）：
	#   站点在 Cloudflare 后面，Caddy 不覆写 X-Forwarded-For 时，后端看到的客户端 IP
	#   全是 127.0.0.1 —— 登录失败计数 / 注册 IP 日限 / 留资频控全部按 IP 生效，
	#   等于对单攻击者无限流、对出口 IP 共享的用户群误伤。取值只用 CF-Connecting-IP
	#   （Cloudflare 覆写过的头，客户端伪造不了），不信任客户端自带的 X-Forwarded-For。
	handle /api/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}

	# ★ /metrics 不再公网暴露（2026-08-26 评审整改 D1）：
	#   Prometheus 改内网抓取（服务器本机 curl 127.0.0.1:8787/metrics 或 SSH 隧道）；
	#   如需恢复公网，须先在后端配置 METRICS_TOKEN 并在此处透传 Authorization 头。
	# handle /metrics {
	# 	reverse_proxy 127.0.0.1:8787
	# }
	# ★ autosales（2026-09-16）：ai-assist 独立服务（AI 销售/客服挂件与管理台）
	#   systemd: ai-assist.service（/opt/ai-assist，密钥 /etc/ai-assist/secrets.env）
	handle /assist-api/* {
		uri strip_prefix /assist-api
		reverse_proxy 127.0.0.1:8790 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}

	handle /status {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}
	# 开放 API 任务接口：文件批量上传放宽请求体上限（其余路径仍受全站限制约束）
	handle /openapi/v1/tasks* {
		request_body {
			max_size 40MB
		}
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}
	handle /openapi/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}
	handle /office/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}
	# 合规文档页（条款/SLA/隐私）与商业静态页由后端渲染，走后端而非 SPA 兜底
	# ★ P2-6（2026-09-18）：/pricing 已归一到 SPA（原 Go 服务端渲染块删除）；
	#   线上那段时间残留的 `handle /pricing` 专项代理段于 2026-09-27 随 F-74 一并按
	#   "兜底段整体走后端"的口径删除——两条路径的上游与 header_up 完全相同，留着只会
	#   让人以为 /pricing 有特殊接线（真实历史：那段配置比仓库新，见文件头同源口径）。
	handle /docs/* {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}

	# 带哈希的静态资源：一年不可变缓存
	handle /assets/* {
		root * /opt/translator/web
		header Cache-Control "public, max-age=31536000, immutable"
		file_server
	}

	# ★★ F-74（2026-09-27 〇-X 第 3 项「主站首页也走后端」）：兜底段由 file_server 改成反代。
	#   根因：`window.__BRANDING__` 由后端 spa.go 的 serveIndexHTML **无条件**注入，
	#   而主站首页此前由 Caddy `file_server` 静态直出 ⇒ 首页永远拿不到注入值，
	#   平台品牌只剩前端异步兜底（首屏先通用品牌、接口回来再换），且主站与租户域名的
	#   首页出自两套实现——租户域名早在 F-73 就是这么接的（AGENTS §一·5 三条硬口径①：
	#   通配块兜底段必须 reverse_proxy，不许写回 file_server）。本次把主站拉到同一口径。
	#   代价与边界：非 /assets 的零散静态件（favicon、robots.txt、taskpane 之外的散件）
	#   改由后端读 dist 直出（spa.go 原有逻辑，租户域名已在生产验证过）；
	#   带哈希的 /assets/* 仍由 Caddy 落盘直出，反代不吃打包资源的带宽。
	#   缓存头不再由 Caddy 写：spa.go 对 index.html 与非 /assets 资源一律 no-cache，
	#   语义与本段旧值（no-cache, must-revalidate）等价，且与租户域名一致。
	handle {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
		}
	}

	request_body {
		max_size 10MB
	}

	log {
		output file /var/log/caddy/translator.access.log {
			roll_size 10MiB
			roll_keep 5
		}
	}
}
