# ============================================================================
# deploy/systemd/prod.conf — 生产环境 systemd drop-in 片段（2026-08-26 评审整改配套）
#                          ★ D5 加固版（全仓端到端评审批次 7）
#
# ── 安装步骤（服务器 root 执行，一次性）────────────────────────────────
#   # ① 建专用运行账号（弃 root 裸跑；目录归属一次性授权）：
#       useradd -r -s /usr/sbin/nologin translator || true
#       chown -R translator:translator /opt/translator
#
#   # ② 密钥独立文件（0600，与代码仓库彻底隔离）：
#       mkdir -p /etc/translator && chmod 750 /etc/translator
#       cat > /etc/translator/secrets.env <<EOF
#       JWT_SECRET=$(openssl rand -hex 32)
#       ADMIN_INIT_PASSWORD=<强密码>
#       ADMIN_TOKEN=$(openssl rand -hex 32)
#       METRICS_TOKEN=$(openssl rand -hex 16)
#       EOF
#       chmod 600 /etc/translator/secrets.env
#       # ★ ADMIN_TOKEN 必须与 Caddy 注入值一致（见 deploy/caddy/translator.conf
#       #   头部说明：Caddy 侧引用同一值的环境变量 TRANSLATOR_ADMIN_TOKEN）。
#
#   # ③ 安装本 drop-in 并启用：
#       mkdir -p /etc/systemd/system/translator.service.d
#       cp deploy/systemd/prod.conf /etc/systemd/system/translator.service.d/prod.conf
#       systemctl daemon-reload && systemctl restart translator
#       journalctl -u translator -n 20   # 确认无「生产密钥强校验」拒启日志
#
# ── 说明 ───────────────────────────────────────────────────────────────
#   REQUIRE_PROD_SECRETS=1 开启启动强校验——JWT_SECRET / ADMIN_INIT_PASSWORD /
#   ADMIN_TOKEN 三者（均在 secrets.env 中）任一缺失即拒绝启动。
#   ★ 旧版缺陷修正（评审 D5）：旧模板注释要求填三把密钥占位符、占位符却不在文件里
#     （照抄必被拒启）；且 Environment= 明文密钥随 unit world-readable。现改为
#     EnvironmentFile 引用 0600 独立文件，unit 本身不含任何真实凭证。
#   TRUST_PROXY_XFF=1：Caddy 反代后按 X-Forwarded-For 取真实客户端 IP
#     （登录/注册限流不再全员共享 127.0.0.1 连坐）；直连暴露部署勿开启。
# ============================================================================

[Service]
User=translator
Group=translator

# —— 密钥：全部来自 0600 独立文件（unit 内零明文凭证）——
EnvironmentFile=/etc/translator/secrets.env

Environment=REQUIRE_PROD_SECRETS=1
Environment=TRUST_PROXY_XFF=1
# ★ 运行时数据根目录（上传/输出/备份/向量/DB 全在此下；丢失会回退到 HOME=/home/translator 且无权限，
#   造成「数据库备份失败: mkdir /home/translator: permission denied」类错误）。必须在沙箱迁移时显式保留！
Environment=USER_DATA_DIR=/opt/translator/data
# METRICS_TOKEN 属非启动必需项，可留本文件（替换为 openssl rand -hex 16 的值）：
Environment=METRICS_TOKEN=REPLACE_ME_METRICS_TOKEN

# ── 并发参数（翻译引擎并发优化 R1/R4 + 沙箱迁移收敛）——
# Chat 后台槽默认 2（另有 1 个交互保留槽）；Embedding 独立 6 槽；
# 文档转换子进程在 1.6G 内存机器上保持串行。升配后可按需调大。
# WORKER_CONCURRENCY：工单/后台任务并发 worker 数（与旧 concurrency drop-in 对齐）。
Environment=LLM_CHAT_CONCURRENT=2
Environment=LLM_EMBED_CONCURRENT=6
Environment=FILEPROC_MAX_CONCURRENT=1
Environment=WORKER_CONCURRENCY=4

# —— 内存护栏（性能优化 Phase A3，1G 机器；沙箱迁移按生产实测覆盖）——
# Go 软上限：生产实测 RSS 峰值 850MiB（服务本体）；此处覆盖旧 650Mi 默认，
# 给文档转换子进程（pdf2docx/LibreOffice）留出峰值空间。
Environment=GOMEMLIMIT=850MiB
# 子进程硬地址空间上限（可选）：设 FILEPROC_RLIMIT_AS_MB 后转换子进程地址空间封顶，
# 超限由内核直接杀掉（快速失败而非挂死）。默认不启用——LibreOffice 虚拟空间偏大，
# 仅在明确要硬封顶时打开（需配合 MemoryMax 留足余量）。
# Environment=FILEPROC_RLIMIT_AS_MB=700

# —— PDF 转换字体（旧 pdffont drop-in 收敛）——
# pdf2docx/LibreOffice 转换中文 PDF 需 CJK 字体；路径在服务器确认后如变化请同步改。
Environment=PDF_FONT_PATH=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

# —— 进程沙箱（D5 新增：此前为零加固、root 裸跑）——
NoNewPrivileges=true
ProtectSystem=full
ProtectHome=true
PrivateTmp=true
ProtectKernelTunables=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
# 可写目录白名单（收敛：不再放行整个 /opt/translator）：
#   数据/上传/输出/日志/备份 均位于 USER_DATA_DIR(/opt/translator/data) 与 log 下，
#   与代码约定一致（UploadDir=UserDataDir/_uploads、OutputDir=UserDataDir/_output）。
#   ★ 部署时需确保列出的目录已存在（ProtectSystem=full 对不存在路径的 mount namespacing 会失败：
#     status=226/NAMESPACE）——缺失目录需先 mkdir 或随服务启动自动创建。
ReadWritePaths=/opt/translator/data /opt/translator/log /opt/translator/data/backups
# 内存护栏：与 GOMEMLIMIT 配套的硬顶（超限由内核 OOM 定向击杀本服务，
# 不再拖死同机其他业务——quant-research 拖死全机的教训）。
# 生产实测峰值 850MiB 服务本体 + 转换子进程余量 → 1150M（低于物理内存，避免 swap 抖动）。
MemoryHigh=950M
MemoryMax=1150M
