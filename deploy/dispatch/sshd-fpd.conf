# /etc/ssh/sshd_config.d/99-fpd.conf · 派发账号 fpd 的登录收口
# 由 bootstrap-dispatch.sh 安装；改完必须先 `sshd -t` 校验通过再 reload（校验不过要立刻回滚，
# 否则会把 sshd 弄成起不来＝把自己锁在机器外面）。
#
# 设计意图：这台机器对主站只暴露"一条被固定死的执行命令"，不给交互 shell、不给端口转发。
#   主站只 outbound 拨入，体验机不主动连主站任何端口 ⇒ 主站不开任何新的监听面
#   （这是派发方案相对"搬第二副本"最大的安全优势）。
Match User fpd
    ForceCommand /opt/fpdispatch/bin/fpd-bridge
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    GatewayPorts no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    MaxSessions 4
    # ★ 可选加固（默认**不开**）：ChrootDirectory /opt/fpdispatch
    #   开了更稳，但代价是 sftp/scp 的路径口径要一起改（chroot 内路径变相对），
    #   且目录属主必须是 root:root、不可被 fpd 写，否则 sshd 直接拒绝连接。
    #   现阶段靠 fpdexec 的"只允许读写 w/ 之下"判据兜住，不叠 chroot——
    #   少一层"看着有其实没生效"的安全感。
