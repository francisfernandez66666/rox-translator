# ============================================================================
# pyproject.toml — 翻译助手（能言 LangCross）开放 API Python SDK 打包配置
# ★ P2 发布管线（2026-09-15）：零第三方依赖单模块包，setuptools 直取 py-module；
#   版本与 @langcross/translator-sdk（npm）、java pom 三端对齐，由
#   scripts/release-sdk.sh 统一同步与校验。
# 构建：python3 -m build（产出 sdist + wheel）
# 试装验证：pip install dist/*.whl && python -c "import translator_sdk; print(translator_sdk.__version__)"
# ============================================================================
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "langcross-translator"
version = "1.0.0"                      # ★ 与 sdk/typescript/package.json version 同步（release 脚本校验）
description = "翻译助手 langcross 开放 API Python SDK（零第三方依赖，异步任务模型）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["translation", "langcross", "sdk", "openapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Translation",
]
dependencies = []                       # 刻意零依赖：urllib 标准库实现，适配客户内网/受限环境

[project.urls]
Homepage = "https://github.com/langcross/langcross"
Changelog = "https://github.com/langcross/langcross/blob/main/sdk/CHANGELOG.md"

[tool.setuptools]
py-modules = ["translator_sdk"]         # 单模块发行（保持 from translator_sdk import TranslatorClient 兼容）
